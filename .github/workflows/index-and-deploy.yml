name: Index and deploy

on:
  schedule:
    # Every 5 minutes, GitHub's documented minimum. It delays scheduled runs under
    # load, so treat this as a target rather than a guarantee; the page's live tail
    # reads the chain directly and is current regardless of when this last ran.
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Indexing depth"
        required: false
        # "auto" picks fast or standard by artifact age, exactly as a scheduled run
        # does. It is the default because the refresh relay below dispatches with it.
        default: "auto"
        type: choice
        options: [auto, standard, quick, deep, rebuild, repair-usdg, repair-usdg-main, repair-pool]
      pool:
        description: "For repair-pool: pool id prefix or pair symbol to re-derive"
        required: false
        type: string
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write
  actions: write     # the refresh relay dispatches the next run

# One indexing run at a time, always. Two concurrent runs would write web/data
# and publish Pages from underneath each other, so the serialisation is not
# negotiable -- but it has a sharp edge worth knowing before you reach for a
# manual run. A group holds at most one running and one PENDING run: queue a
# workflow_dispatch behind a long run, push a commit, and the push takes the
# pending slot and your dispatch is CANCELLED, not delayed. (That happened to a
# repair dispatch here.) So: start the manual run, then wait for it before
# pushing anything.
concurrency:
  group: index-and-deploy
  cancel-in-progress: false

jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Resume state AND the generated data, in two caches rather than one.
      #
      # They are split because the cache is restored ON TOP of the checkout, so a
      # cached web/data silently overrides whatever is committed. That makes a data
      # repair pushed to git unshippable: the next run restores the broken copy over
      # it. (Measured: 205 of 211 AI/USDG hourly closes were 1e12 too small after a
      # decimals fix, and a committed repair could not have taken effect.) With the
      # artifacts on their own key, bumping the version in their key (indexer-data-vN)
      # makes exactly one run fall through to the committed files and re-adopt them,
      # while .cache keeps the expensive discovery state (pool catalogue, bridge
      # venues) intact.
      - name: Restore indexer resume state
        uses: actions/cache@v4
        with:
          path: .cache
          key: indexer-state-${{ github.run_id }}
          restore-keys: indexer-state-

      # Bump vN to force one run to re-adopt the committed web/data.
      - name: Restore generated artifacts
        uses: actions/cache@v4
        with:
          path: web/data
          key: indexer-data-v6-${{ github.run_id }}
          restore-keys: indexer-data-v6-

      # Runs BEFORE indexing, and unlike indexing it is a hard gate.
      #
      # The index step is continue-on-error on purpose: a throttled public RPC must
      # not take the published site down. But that also makes a code fault look
      # exactly like a rate limit -- a ReferenceError in the routing stage killed
      # every run for hours while each one still reported success and quietly
      # republished four-hour-old data. `node --check` parses without executing, so
      # it saw nothing. This exercises the task logic offline in seconds, and a
      # failure here stops the run instead of hiding behind stale data.
      - name: Smoke-test task logic (no network)
        run: node src/smoke.mjs

      # The first run backfills ~59 days from scratch and is the slow one; every run
      # after it resumes from the committed cursor and only scans new blocks.
      # Flow depth is bounded by --top because per-pool backfill dominates the clock,
      # while ranking, routing and bridge windows stay at full width.
      # continue-on-error is deliberate. The public RPC throttles datacenter IPs
      # much harder than residential ones, so a scheduled run can lose a race it
      # would win locally. A failed refresh must not take the published site down:
      # the last committed data is still perfectly good, just older.
      - name: Index chain data
        id: index
        continue-on-error: true
        timeout-minutes: 75
        # The dedicated endpoint's URL carries its API key, so it lives only in a
        # repository secret. Without the secret the indexer uses the chain's public
        # endpoint, exactly as before. RPC_LABEL in config.mjs keeps the path, and
        # with it the key, out of the published meta.json.
        env:
          RPC_URL: ${{ secrets.RPC_URL }}
        run: |
          MODE="${{ github.event.inputs.mode }}"
          # A relayed or manual "auto" run chooses its depth the way a scheduled one does.
          AUTO=""
          if [ "$MODE" = "auto" ]; then MODE=""; AUTO="1"; fi
          # Scheduled runs pick their own depth. Ranking pool activity and building
          # the routing index both re-read a trailing window and cannot be made
          # incremental, so they dominate a refresh — but they measure things that
          # move over days. Running them every five minutes buys nothing. So the
          # frequent run does only what changes continuously (flow, burns, price).
          #
          # The heavy depth runs every SIX hours, not hourly, and that is about the
          # concurrency lock rather than about the data. One workflow serialises on
          # group "index-and-deploy", so while a standard run holds it every
          # five-minute tick is blocked -- and GitHub drops scheduled events it
          # cannot start rather than queueing them all. Measured: hourly standard
          # runs plus a couple of pushes left a FOUR-HOUR hole between successful
          # refreshes, on a site whose whole point is a five-minute cadence. Pool
          # ranking, routing and bridges measure things that move over days, so
          # four passes a day is ample and the fast path gets the lock back.
          # A PUSH changes code, not chain data, so it has no business re-deriving
          # pool discovery, cross-routing and bridges. It was doing exactly that, and
          # that is where the contention actually came from: measured on one run,
          # discovery 8.3 min, cross-routing 20.6 min and bridges ~45 min, for a
          # 1h15m job holding the only lock -- on every single commit. A day of
          # commits therefore starved the five-minute schedule almost continuously.
          # Pushes take the fast path; the deep figures are refreshed on their own
          # cadence below, which is what they were always meant to be on.
          if [ -z "$MODE" ] && [ "${{ github.event_name }}" = "push" ]; then
            MODE="fast"
            echo "push -> fast (code changed, chain data did not)"
          fi
          # Standard is chosen by how old the deep artifacts are, not by the clock.
          #
          # This used to fire only when a scheduled run started in the first five
          # minutes of 00/06/12/18 UTC. GitHub throttles a */5 cron to a run every
          # two to five hours at an arbitrary minute, so that window was almost never
          # hit: measured, ten scheduled runs in a row chose fast (one at 06:05,
          # missing by a minute), and bridges.json went 25 hours without a refresh
          # while every page on the site kept looking current.
          #
          # Age cannot be missed. The oldest of the three deep artifacts decides, and
          # a separate attempt stamp in the resume cache stops a standard run that
          # times out before writing from being retried on every tick and starving
          # the fast path of the lock.
          if [ -z "$MODE" ] && { [ "${{ github.event_name }}" = "schedule" ] || [ -n "$AUTO" ]; }; then
            NOW=$(date -u +%s)
            OLDEST=$(node -e '
              const fs = require("fs");
              const ts = ["bridges", "launchpad", "pools"].map((f) => {
                try { return JSON.parse(fs.readFileSync("web/data/" + f + ".json", "utf8")).updatedAt || 0; }
                catch { return 0; }
              });
              console.log(Math.min(...ts));')
            LAST_TRY=$(cat .cache/last-standard-attempt 2>/dev/null || echo 0)
            AGE=$(( NOW - OLDEST )); SINCE_TRY=$(( NOW - LAST_TRY ))
            echo "oldest deep artifact $(( AGE / 3600 ))h old; last standard attempt $(( SINCE_TRY / 3600 ))h ago"
            if [ "$AGE" -gt 21600 ] && [ "$SINCE_TRY" -gt 10800 ]; then
              MODE="standard"
              mkdir -p .cache && echo "$NOW" > .cache/last-standard-attempt
            else MODE="fast"; fi
            echo "scheduled run -> $MODE"
          fi
          # --top is how many pools get hourly depth, and it decides how much of the
          # chain the site can actually see. Measured on the ranked set: the top 8
          # pools carry 73% of swaps, the top 20 carry 90%, and the tail past that is
          # long and thin. Eight was also biased, not merely partial -- it happened to
          # include the big hookless venues and miss a dozen small hooked ones, so the
          # leakage headline read 74% where the full active set says 65%.
          #
          # Twenty costs almost nothing per run once backfilled, because flow resumes
          # from each pool's cursor, and nothing at all on the live layer: pool id is
          # topic1, so the browser covers every indexed venue in one request whether
          # that is three pools or thirty.
          case "$MODE" in
            fast)    node src/indexer.mjs --fast --top 20 ;;
            quick)   node src/indexer.mjs --quick ;;
            deep)    node src/indexer.mjs --top 30 ;;
            # Discards stored series and re-derives every bucket. Needed when a
            # decoding input changes (a token's decimals, say), because resuming
            # from a cursor only adds new buckets and never revisits old ones.
            rebuild) node src/indexer.mjs --rebuild --top 20 ;;
            # Repair a decoding fix that only affected some venues, without paying
            # for a full re-derive of every pool. Bridges are skipped: a repair has
            # one job and the 75-minute ceiling is real -- re-deriving both USDG
            # pools from genesis is RPC-bound and took over an hour measured
            # locally, so spending any of that budget on bridge venue discovery
            # risks the timeout killing the repair itself.
            repair-usdg) node src/indexer.mjs --rebuild-pools usdg --top 20 --no-bridges ;;
            # Just the flagship AI/USDG venue -- the one the dollar price and market
            # cap read from. Half the work, for when the full repair will not fit.
            repair-usdg-main) node src/indexer.mjs --rebuild-pools 0x7aebd805 --top 20 --no-bridges ;;
            # Re-derive one named venue. A decode fix only ever repairs the future --
            # resuming from a cursor never revisits a stored bucket -- so when one
            # lands, the pools it affected have to be re-derived by hand. Cheaper
            # than a full rebuild by roughly the number of pools you are not
            # touching. Pass the pool id prefix or the pair symbol in "pool".
            repair-pool)
              if [ -z "${{ github.event.inputs.pool }}" ]; then
                echo "::error::repair-pool needs a pool id prefix or symbol in the 'pool' input"; exit 1
              fi
              node src/indexer.mjs --rebuild-pools "${{ github.event.inputs.pool }}" --top 20 --no-bridges ;;
            *)       node src/indexer.mjs --top 20 ;;
          esac

      # A silently-wrong index is worse than a failed one, so bad data never ships.
      - name: Verify invariants
        id: verify
        if: steps.index.outcome == 'success'
        run: node src/verify.mjs

      # Cross-validation. Reports rather than gates, on purpose: verify.mjs answers
      # "is this data sound", and this answers the different question of "do the
      # numbers agree with themselves when derived two independent ways". A
      # disagreement here usually means a unit or a denominator is wrong somewhere,
      # which wants a person reading it, not a red build blocking an otherwise-good
      # refresh. Every dimensional bug this project has had would have shown up here
      # as an order-of-magnitude gap.
      - name: Cross-validate the headline numbers
        if: steps.index.outcome == 'success'
        continue-on-error: true
        run: node src/audit.mjs

      # Snapshot to git at most every SNAPSHOT_MINUTES. At a 5-minute cadence,
      # committing every run would be ~288 commits and ~200MB of superseded JSON a
      # day. The cache carries data between runs; git only needs a periodic
      # fallback for cache eviction, and the deploy publishes from the workspace
      # either way, so the live site is always the freshest data regardless.
      - name: Snapshot data to git (periodically)
        if: steps.index.outcome == 'success' && steps.verify.outcome == 'success'
        env:
          SNAPSHOT_MINUTES: "120"
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          LAST=$(git log -1 --format=%ct -- web/data || echo 0)
          AGE=$(( $(date +%s) - ${LAST:-0} ))
          if [ "$AGE" -lt $(( SNAPSHOT_MINUTES * 60 )) ]; then
            echo "Last snapshot ${AGE}s ago; skipping commit (threshold $(( SNAPSHOT_MINUTES * 60 ))s)."
            exit 0
          fi
          git add web/data
          if git diff --staged --quiet; then
            echo "No data change."
          else
            git commit -m "chore(data): periodic snapshot of on-chain index [skip ci]"
            git pull --rebase --autostash origin main || true
            git push || echo "push raced another run; the cache still carries the data"
          fi

      - name: Report refresh outcome
        run: |
          echo "index: ${{ steps.index.outcome }}"
          if [ "${{ steps.index.outcome }}" != "success" ]; then
            echo "::warning::Indexing did not complete; publishing the last good data instead."
          fi
          # Only a total absence of data is fatal -- there would be nothing to serve.
          test -f web/data/meta.json || { echo "::error::No indexed data exists yet."; exit 1; }

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy:
    needs: index
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # The refresh relay: every run ends by starting the next one.
  #
  # GitHub throttles a */5 cron to one run every two to five hours, which is why
  # "every five minutes" never happened. Runs dispatched with workflow_dispatch are
  # not throttled, and GITHUB_TOKEN is explicitly allowed to trigger that one event,
  # so each run waits out the rest of its interval and dispatches its successor.
  #
  # It cannot multiply: the concurrency group keeps one pending run and a newer
  # request replaces an older one, so a push, a cron tick and a relay arriving
  # together collapse into a single next run. If a link ever breaks, the throttled
  # cron above is still there to restart the chain within a few hours.
  #
  # It only runs with a dedicated endpoint configured -- polling the public node
  # every five minutes is how the rate limits started -- and a repository variable
  # REFRESH_CHAIN=off stops it without a code change.
  relay:
    needs: [index, deploy]
    if: always() && vars.REFRESH_CHAIN != 'off'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Wait out the interval, then dispatch the next run
        env:
          GH_TOKEN: ${{ github.token }}
          HAS_RPC: ${{ secrets.RPC_URL != '' }}
          REFRESH_MINUTES: ${{ vars.REFRESH_MINUTES || '5' }}
        run: |
          if [ "$HAS_RPC" != "true" ]; then
            echo "No dedicated RPC_URL secret; not chaining runs against the public endpoint."
            exit 0
          fi
          STARTED=$(gh run view "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --json createdAt -q .createdAt)
          ELAPSED=$(( $(date -u +%s) - $(date -u -d "$STARTED" +%s) ))
          WAIT=$(( REFRESH_MINUTES * 60 - ELAPSED ))
          echo "run took ${ELAPSED}s; interval ${REFRESH_MINUTES}m"
          if [ "$WAIT" -gt 0 ]; then echo "waiting ${WAIT}s"; sleep "$WAIT"; fi
          gh workflow run index-and-deploy.yml --repo "$GITHUB_REPOSITORY" --ref main -f mode=auto
          echo "next run dispatched"

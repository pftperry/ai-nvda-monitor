name: Index and deploy

on:
  schedule:
    # Every 5 minutes, GitHub's documented minimum. It delays scheduled runs under
    # load, so treat this as a target rather than a guarantee; the page's live tail
    # reads the chain directly and is current regardless of when this last ran.
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Indexing depth"
        required: false
        default: "standard"
        type: choice
        options: [standard, quick, deep, rebuild]
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: index-and-deploy
  cancel-in-progress: false

jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Resume state AND the generated data. Caching web/data is what lets a
      # 5-minute cadence work without committing 288 times a day: each run resumes
      # from the previous run's artifacts, and git only receives a periodic
      # snapshot as a durable fallback for when the cache is evicted.
      - name: Restore indexer cache
        uses: actions/cache@v4
        with:
          path: |
            .cache
            web/data
          key: indexer-state-${{ github.run_id }}
          restore-keys: indexer-state-

      # The first run backfills ~59 days from scratch and is the slow one; every run
      # after it resumes from the committed cursor and only scans new blocks.
      # Flow depth is bounded by --top because per-pool backfill dominates the clock,
      # while ranking, routing and bridge windows stay at full width.
      # continue-on-error is deliberate. The public RPC throttles datacenter IPs
      # much harder than residential ones, so a scheduled run can lose a race it
      # would win locally. A failed refresh must not take the published site down:
      # the last committed data is still perfectly good, just older.
      - name: Index chain data
        id: index
        continue-on-error: true
        timeout-minutes: 75
        run: |
          case "${{ github.event.inputs.mode }}" in
            quick)   node src/indexer.mjs --quick ;;
            deep)    node src/indexer.mjs --top 18 ;;
            # Discards stored series and re-derives every bucket. Needed when a
            # decoding input changes (a token's decimals, say), because resuming
            # from a cursor only adds new buckets and never revisits old ones.
            rebuild) node src/indexer.mjs --rebuild --top 8 ;;
            *)       node src/indexer.mjs --top 8 ;;
          esac

      # A silently-wrong index is worse than a failed one, so bad data never ships.
      - name: Verify invariants
        id: verify
        if: steps.index.outcome == 'success'
        run: node src/verify.mjs

      # Snapshot to git at most every SNAPSHOT_MINUTES. At a 5-minute cadence,
      # committing every run would be ~288 commits and ~200MB of superseded JSON a
      # day. The cache carries data between runs; git only needs a periodic
      # fallback for cache eviction, and the deploy publishes from the workspace
      # either way, so the live site is always the freshest data regardless.
      - name: Snapshot data to git (periodically)
        if: steps.index.outcome == 'success' && steps.verify.outcome == 'success'
        env:
          SNAPSHOT_MINUTES: "120"
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          LAST=$(git log -1 --format=%ct -- web/data || echo 0)
          AGE=$(( $(date +%s) - ${LAST:-0} ))
          if [ "$AGE" -lt $(( SNAPSHOT_MINUTES * 60 )) ]; then
            echo "Last snapshot ${AGE}s ago; skipping commit (threshold $(( SNAPSHOT_MINUTES * 60 ))s)."
            exit 0
          fi
          git add web/data
          if git diff --staged --quiet; then
            echo "No data change."
          else
            git commit -m "chore(data): periodic snapshot of on-chain index [skip ci]"
            git pull --rebase --autostash origin main || true
            git push || echo "push raced another run; the cache still carries the data"
          fi

      - name: Report refresh outcome
        run: |
          echo "index: ${{ steps.index.outcome }}"
          if [ "${{ steps.index.outcome }}" != "success" ]; then
            echo "::warning::Indexing did not complete; publishing the last good data instead."
          fi
          # Only a total absence of data is fatal -- there would be nothing to serve.
          test -f web/data/meta.json || { echo "::error::No indexed data exists yet."; exit 1; }

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy:
    needs: index
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

name: Index and deploy

on:
  schedule:
    # hourly. GitHub delays scheduled runs under load, and the concurrency group
    # below means a long backfill is never interrupted by the next tick.
    - cron: "7 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Indexing depth"
        required: false
        default: "standard"
        type: choice
        options: [standard, quick, deep]
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: index-and-deploy
  cancel-in-progress: false

jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Resumable cursor state (block -> time anchors) so repeat runs stay cheap.
      - name: Restore indexer cache
        uses: actions/cache@v4
        with:
          path: .cache
          key: indexer-state-${{ github.run_id }}
          restore-keys: indexer-state-

      # The first run backfills ~59 days from scratch and is the slow one; every run
      # after it resumes from the committed cursor and only scans new blocks.
      # Flow depth is bounded by --top because per-pool backfill dominates the clock,
      # while ranking, routing and bridge windows stay at full width.
      - name: Index chain data
        timeout-minutes: 300
        run: |
          case "${{ github.event.inputs.mode }}" in
            quick) node src/indexer.mjs --quick ;;
            deep)  node src/indexer.mjs --top 18 ;;
            *)     node src/indexer.mjs --top 8 ;;
          esac

      # A silently-wrong index is worse than a failed one, so bad data never ships.
      - name: Verify invariants
        run: node src/verify.mjs

      - name: Commit refreshed data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/data
          if git diff --staged --quiet; then
            echo "No data change."
          else
            git commit -m "chore(data): refresh on-chain index [skip ci]"
            git push
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy:
    needs: index
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
